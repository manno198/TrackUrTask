services:
  postgres:
    image: postgres:16-alpine
    container_name: trackurtask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackurtask
      POSTGRES_PASSWORD: trackurtask
      POSTGRES_DB: trackurtask
    ports:
      - "5434:5432"
    volumes:
      - trackurtask_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackurtask -d trackurtask"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trackurtask_pgdata:
